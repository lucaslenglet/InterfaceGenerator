name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Code that reproduces the problem
      description: The smallest annotated type that shows the issue.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include the generated code or the diagnostic you got, if any.
    validations:
      required: true
